<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trôi chảy cùng cô H₂O</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Trợ lí AI luyện Nói và nghe Ngữ văn 8 – cô Nguyễn Thị Thủy, THCS Ngô Quyền, Hà Nội">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: một cột như dòng nước chảy từ trên xuống; đầu trang là "mặt nước", các khối bo tròn như đá cuội. Thủy sinh Mộc: xanh nước là chính, xanh mầm là phụ. */
:root{
  --water:#1E6FA8;      /* Thủy – màu chính */
  --water-deep:#14507C;
  --leaf:#3FA36B;       /* Mộc – màu phụ */
  --jade:#17A2A2;       /* giao thoa – nút, huy hiệu */
  --bg:#F2F8FB;         /* nền xanh rất nhạt thay cho trắng (Kim) */
  --surface:#FFFFFF;
  --surface-2:#E6F1F7;
  --ink:#163246;        /* chữ xanh than */
  --ink-soft:#4A6476;
  --line:#CFE2EC;
  --coral:#E07A5F;      /* chỉ dùng cho cảnh báo nhẹ */
  --on-accent:#FFFFFF;
  --shadow:0 6px 18px rgba(20,80,124,.10);
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#5BA9DE;--water-deep:#8CC6EC;--leaf:#6CC892;--jade:#3CC4C0;
  --bg:#0D1B26;--surface:#132634;--surface-2:#183244;--ink:#E3F0F7;--ink-soft:#A3BCCB;--line:#244559;
  --coral:#F09A82;--on-accent:#06202E;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#5BA9DE;--water-deep:#8CC6EC;--leaf:#6CC892;--jade:#3CC4C0;
  --bg:#0D1B26;--surface:#132634;--surface-2:#183244;--ink:#E3F0F7;--ink-soft:#A3BCCB;--line:#244559;
  --coral:#F09A82;--on-accent:#06202E;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:700;color:var(--water-deep)}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.muted{color:var(--ink-soft)}
.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Đầu trang */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);text-align:left}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:800;color:var(--water-deep);display:block;line-height:1.1}
.brand span{font-size:.75rem;color:var(--ink-soft)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{white-space:nowrap;background:none;border:0;padding:8px 10px;border-radius:12px;color:var(--ink-soft);font-weight:600;font-size:.9rem}
nav.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--water-deep)}
.brand b{white-space:nowrap}
@media (max-width:560px){.top-in{flex-wrap:wrap;row-gap:6px}.brand span{display:none} nav.tabs{width:100%} nav.tabs button{flex:1;padding:7px 4px;font-size:.88rem}}

/* Mặt nước – lời chào */
.hero{margin-top:20px;background:linear-gradient(160deg,var(--water) 0%,var(--jade) 100%);color:var(--on-accent);border-radius:28px;padding:22px 22px 0;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.hero h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800}
.hero .slogan{font-family:var(--f-display);font-weight:600;font-size:1.1rem;opacity:.95}
.bubble{background:var(--surface);color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 14px;margin:14px 0 18px;max-width:46ch;box-shadow:var(--shadow);font-weight:500}
.hero .mascot{width:120px;height:132px;margin-bottom:-6px}
.wave{display:block;width:100%;height:28px;margin-top:4px}
@media (max-width:480px){.hero .mascot{width:92px;height:100px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.who{display:grid;grid-template-columns:110px 1fr;gap:10px}
@media (max-width:420px){.who{grid-template-columns:1fr}}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat b{font-family:var(--f-display);font-size:1.5rem;color:var(--water-deep);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--ink-soft)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.kind-h{font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--ink-soft);margin:8px 0 -6px;letter-spacing:.02em}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lesson{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink);transition:transform .15s,border-color .15s}
.lesson:hover{border-color:var(--jade);transform:translateY(-2px)}
.lesson .num{font-family:var(--f-display);font-weight:800;color:var(--water);font-size:.95rem}
.lesson .t{font-weight:600;line-height:1.35}
.lesson .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft)}
.chip.star{background:var(--leaf);color:var(--on-accent)}
.chip.done{background:transparent;border:1px solid var(--jade);color:var(--jade)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--jade);color:var(--on-accent);min-height:46px}
.btn.water{background:var(--water)}
.btn.leaf{background:var(--leaf)}
.btn.ghost{background:transparent;color:var(--water-deep);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font-size:1.15rem;padding:16px 28px;min-height:60px}

/* Trang bài học */
.back{background:none;border:0;color:var(--water);font-weight:600;padding:12px 0 4px}
.lesson-head{display:flex;flex-direction:column;gap:6px}
.lesson-head .num{font-family:var(--f-display);color:var(--leaf);font-weight:800}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:999px}
.steps button{border:0;background:none;border-radius:999px;padding:9px 6px;font-weight:700;color:var(--ink-soft);font-size:.92rem}
.steps button[aria-selected="true"]{background:var(--surface);color:var(--water-deep);box-shadow:var(--shadow)}
.purpose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.purpose{grid-template-columns:1fr}}
.purpose div{background:var(--surface-2);border-radius:14px;padding:12px}
.purpose b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--leaf);margin-bottom:2px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topic{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:500}
.topic[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:var(--on-accent)}
.q{display:flex;flex-direction:column;gap:6px}
.q p{font-weight:600}
.outline{display:grid;gap:10px}
.outline .part{border-left:4px solid var(--jade);padding-left:12px}
.outline .part:nth-child(1){border-color:var(--water)}
.outline .part:nth-child(3){border-color:var(--leaf)}

/* Luyện nói */
.mic-area{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px;text-align:center}
.timer{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--water-deep);font-variant-numeric:tabular-nums;line-height:1}
.target{font-size:.85rem;color:var(--ink-soft)}
.micbtn{width:112px;height:112px;border-radius:50%;border:0;background:var(--water);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 8px var(--surface-2)}
.micbtn svg{width:46px;height:46px}
.micbtn.on{background:var(--coral);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 8px var(--surface-2)}50%{box-shadow:0 0 0 18px var(--surface-2)}}
@media (prefers-reduced-motion:reduce){.micbtn.on{animation:none}.lesson{transition:none}}
.live{min-height:120px;background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;white-space:pre-wrap}
.live .interim{color:var(--ink-soft)}
.peek{width:100%;text-align:left;font-size:.88rem;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.peek b{color:var(--water-deep)}
.peer{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;text-align:left;width:100%}
.peer .av{width:56px;height:56px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.say.blur{filter:blur(6px);user-select:none}
.peer .say{background:var(--surface-2);border-radius:4px 16px 16px 16px;padding:10px 12px}
.mode{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mode button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--ink-soft)}
.mode button[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf)}
.note{font-size:.85rem;background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--ink-soft)}
.note.warn{border-left:4px solid var(--coral)}
details summary{cursor:pointer;font-weight:600;color:var(--water)}

/* Kết quả */
.score-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.score-top .mascot{width:96px;height:106px}
@media (max-width:420px){.score-top{grid-template-columns:1fr;justify-items:center;text-align:center}}
.big-score{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--water-deep);font-variant-numeric:tabular-nums}
.big-score small{font-size:1.1rem;color:var(--ink-soft)}
.crit{display:grid;gap:12px}
.crit-row{display:grid;grid-template-columns:minmax(120px,170px) 1fr 44px;gap:10px;align-items:center}
@media (max-width:460px){.crit-row{grid-template-columns:1fr 44px}.crit-row .bar{grid-column:1/-1;order:3}}
.crit-row .name{font-weight:600;font-size:.92rem}
.bar{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--water),var(--leaf))}
.crit-row .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.fb{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.fb li{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:start}
.fb li .ic{font-size:1.15rem;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metrics div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.metrics b{display:block;font-family:var(--f-display);font-size:1.25rem;color:var(--water-deep);font-variant-numeric:tabular-nums}
.metrics span{font-size:.78rem;color:var(--ink-soft)}
.delta-up{color:var(--leaf);font-weight:700}
.delta-down{color:var(--coral);font-weight:700}
.check{display:grid;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:0}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--leaf);flex:none}
.transcript{background:var(--bg);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:.95rem}
mark.f{background:transparent;color:var(--coral);font-weight:700;text-decoration:underline wavy}
mark.k{background:transparent;color:var(--leaf);font-weight:700}

/* Hành trình */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.badges{grid-template-columns:repeat(2,1fr)}}
.badge{border-radius:var(--r);padding:14px 10px;text-align:center;background:var(--surface);border:1.5px solid var(--line)}
.badge .e{font-size:2rem;line-height:1.2;filter:grayscale(1);opacity:.45}
.badge.got{border-color:var(--jade)}
.badge.got .e{filter:none;opacity:1}
.badge b{display:block;font-family:var(--f-display)}
.badge span{font-size:.75rem;color:var(--ink-soft)}
.hist{width:100%;border-collapse:collapse;font-size:.9rem}
.hist th,.hist td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.spark{width:100%;height:120px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
/* Bé Giọt sống động */
.alive .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.alive .leaf{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.8s ease-in-out infinite}
.alive.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-10px) scale(.97,1.03)}80%{transform:translateY(0) scale(1.04,.96)}}
.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1.5px dashed var(--jade);border-radius:var(--r);padding:12px 14px}
.tip .lbl{font-family:var(--f-display);font-weight:700;color:var(--jade);font-size:.85rem;letter-spacing:.03em}
.tip .ico{font-size:1.6rem}
/* Thẻ bài học có biểu tượng */
.lesson{padding:0;overflow:hidden;gap:0;border-color:color-mix(in srgb,var(--lc) 35%,var(--line))}
.lesson:hover{border-color:var(--lc)}
.lesson .band{display:flex;align-items:center;gap:10px;background:var(--lc);color:#fff;padding:12px 14px 6px}
.lesson .bandwave{display:block;width:100%;height:10px;margin-top:-1px}
.lesson .ic,.lhead .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18);color:#fff}
.lesson .ic svg,.lhead .ic svg{width:25px;height:25px}
.lesson .bt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.lesson .bt b{font-family:var(--f-display);font-size:1.05rem}
.lesson .bt span{font-size:.82rem;opacity:.92}
.lesson .t{padding:8px 14px 0}
.lesson .meta{padding:10px 14px 14px}
.lesson.is-cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 45%,transparent)}
.lhead{margin-top:6px;background:var(--lc);color:#fff;border-radius:22px;overflow:hidden}
.lhead .lh-in{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 4px}
.lhead h2{color:#fff;font-size:1.35rem}
.lhead .num{font-family:var(--f-display);font-weight:700;opacity:.9}
.lhead .wave{display:block;width:100%;height:20px}
/* Trang trí hai bên (màn hình rộng) */
.deco{display:none}
@media (min-width:1080px){
  .deco{display:block;position:fixed;top:0;bottom:0;width:calc((100vw - 800px)/2);z-index:0;pointer-events:none;overflow:hidden;
    background:linear-gradient(180deg,color-mix(in srgb,var(--water) 16%,var(--bg)),color-mix(in srgb,var(--leaf) 14%,var(--bg)))}
  .deco.l{left:0}.deco.r{right:0;transform:scaleX(-1)}
  .deco svg{position:absolute;inset:0;width:100%;height:100%}
  main.wrap,footer.foot{position:relative;z-index:1}
}
.featured{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--leaf) 14%,var(--surface)),var(--surface));border:1.5px solid var(--leaf);border-radius:22px;padding:18px}
.featured .mascot{width:82px;height:90px}
.src{font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-top:4px}
/* Sóng nước theo giọng nói */
.mic-wrap{position:relative;width:260px;height:260px;max-width:100%;display:grid;place-items:center}
.mic-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.vol{font-size:.85rem;font-weight:600;color:var(--ink-soft);min-height:1.4em}
/* Giọt điểm */
.drop{width:120px;height:140px;flex:none}
.drop .lv{animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.drop .wv{animation:waveX 2.6s linear infinite}
@keyframes rise{from{transform:translateY(140px)}}
@keyframes waveX{to{transform:translateX(-60px)}}
.drop text{font-family:var(--f-display);font-weight:800;font-size:30px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:5px}
.celebrate{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--leaf) 14%,var(--surface));border:1.5px solid var(--leaf);border-radius:var(--r);padding:12px 14px;font-weight:600}
.celebrate .e{font-size:2rem}
#rain{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
/* Dòng sông hành trình */
.river{width:100%;height:auto;display:block}
.river text{font-family:var(--f-display);font-weight:700;fill:var(--ink);font-size:15px}
.river .need{font-family:var(--f-body);font-weight:500;fill:var(--ink-soft);font-size:11px}
@media (prefers-reduced-motion:reduce){.drop .lv{animation:none}.alive.bob{animation-duration:4s}}
footer.foot{margin-top:28px;font-size:.8rem;color:var(--ink-soft);text-align:center}
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" id="brandBtn" aria-label="Về trang chủ">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#logo"/></svg>
      <div><b>Trôi chảy cùng cô H₂O</b><span>Nói trôi chảy – Nghe thấm sâu</span></div>
    </button>
    <nav class="tabs" aria-label="Điều hướng">
      <button data-go="home" aria-current="page">Bài học</button>
      <button data-go="journey">Hành trình</button>
      <button data-go="about">Giới thiệu</button>
    </nav>
  </div>
</header>

const FILLERS = ["ờ","ừ","ừm","ơ","à","ạ à","hừm","kiểu là","kiểu như","thì là","là là","nói chung là","đại loại là","thực ra là","cái này","cái kia","thế thì","rồi thì"];

function norm(s){return " "+String(s).toLowerCase().replace(/[.,!?;:"“”'()\[\]…\-–—\n\r]+/g," ").replace(/\s+/g," ").trim()+" ";}
function countPhrases(t,list){let n=0,found=[];for(const p of list){const needle=" "+p+" ";let i=t.indexOf(needle),c=0;while(i!==-1){c++;i=t.indexOf(needle,i+needle.length-1)}if(c){n+=c;found.push(p)}}return {n,found};}
function words(t){return t.trim().split(/\s+/).filter(Boolean);}
function clamp(x,a=0,b=10){return Math.max(a,Math.min(b,x));}
function r1(x){return Math.round(x*10)/10;}

function scoreSpeech({text,seconds,lesson,topic,mode,peerText,typed}){
  const t=norm(text), w=words(t), nw=w.length;
  const kind=lesson.kind;
  const sec = seconds>0 ? seconds : Math.round(nw/150*60);
  const fill=countPhrases(t,FILLERS);
  // từ lặp liền nhau ("em em", "là là")
  let rep=0;for(let i=1;i<w.length;i++){if(w[i]===w[i-1]&&w[i].length>1)rep++;}
  const wpm = sec>0 ? Math.round(nw/sec*60) : 0;
  const per100 = nw? (fill.n+rep)/nw*100 : 0;
  const crit=[];
  const isReply = kind==="thaoluan" && mode==="reply";
  const isSum = kind==="thaoluan" && mode==="summary";
  const tgt = isReply ? [30,90] : isSum ? [40,120] : KINDS[kind].target;

  // Thời lượng
  let sDur; if(sec<tgt[0]) sDur=clamp(sec/tgt[0]*10); else if(sec<=tgt[1]) sDur=10; else sDur=clamp(10-(sec-tgt[1])/30*2,6);
  crit.push({key:"dur",name:"Thời lượng",v:sDur});

  // Trôi chảy
  const sFlu=clamp(10-per100*1.4);
  crit.push({key:"flu",name:"Trôi chảy",v:sFlu});

  // Tốc độ (âm tiết/phút)
  let sPace; if(wpm>=110&&wpm<=190) sPace=10; else if(wpm<110) sPace=clamp(10-(110-wpm)/12); else sPace=clamp(10-(wpm-190)/12);
  crit.push({key:"pace",name:"Tốc độ nói",v:sPace});

  const kw = (lesson.keywords||[]).concat(topic? norm(topic).trim().split(" ").filter(x=>x.length>1):[]);
  const kwHit=countPhrases(t,[...new Set(kw)]);
  const info={};

  if(isSum){
    const STOP=new Set(["mình","bạn","là","của","và","thì","không","cũng","cho","với","những","các","một","được","này","đó","nên","rồi","học","sinh","có","để","khi","việc","người","chỉ","như","nghĩ","cần"]);
    const ops=String(peerText||"").split("|").map(x=>norm(x).trim().split(" ").filter(w=>w.length>1&&!STOP.has(w)));
    let covered=0;const covers=[];
    for(const o of ops){const u=[...new Set(o)];const hit=u.filter(x=>t.includes(" "+x+" ")).length;const ok=u.length&&hit/u.length>=.3;covers.push(ok);if(ok)covered++;}
    const sm=countPhrases(t,["thứ nhất","thứ hai","thứ ba","đầu tiên","tiếp theo","bạn thứ nhất","bạn thứ hai","bạn thứ ba","một bạn","có bạn","bạn khác","bạn còn lại","bạn an","bạn bình","bạn chi","cho rằng","ý kiến","đa số","một số bạn"]);
    const cc=countPhrases(t,["tóm lại","như vậy","kết luận","thống nhất","nhóm mình","nhóm em","chúng ta","cuối cùng","nói chung"]);
    crit.push({key:"cover",name:"Nắm ý chính các bạn",v:ops.length?covered/ops.length*10:0});
    crit.push({key:"sumstruct",name:"Trình bày lại mạch lạc",v:clamp(Math.min(sm.n,5)*2)});
    crit.push({key:"conclude",name:"Kết luận chung",v:clamp(cc.n?6+Math.min(cc.n,2)*2:1)});
    Object.assign(info,{covered,total:ops.length,covers});
  } else if(isReply){
    const pw=norm(peerText||"").trim().split(" ").filter(x=>x.length>2);
    const overlap=[...new Set(pw)].filter(x=>t.includes(" "+x+" ")).length;
    const rc=countPhrases(t,MARK.recall), ag=countPhrases(t,MARK.agree), dg=countPhrases(t,MARK.disagree);
    const rs=countPhrases(t,MARK.reason), ev=countPhrases(t,MARK.evidence), po=countPhrases(t,MARK.polite), ru=countPhrases(t,MARK.rude);
    crit.push({key:"listen",name:"Lắng nghe ý bạn",v:clamp((rc.n?5:0)+Math.min(overlap,5))});
    crit.push({key:"stance",name:"Nêu rõ quan điểm",v:clamp((ag.n||dg.n)?7+Math.min(countPhrases(t,MARK.opinion).n,3):countPhrases(t,MARK.opinion).n?5:1)});
    crit.push({key:"reason",name:"Lí lẽ, bằng chứng",v:clamp(Math.min(rs.n,3)*2.2+Math.min(ev.n,2)*1.7)});
    crit.push({key:"polite",name:"Lời lẽ lịch sự",v:clamp(5+Math.min(po.n,3)*1.7-ru.n*4)});
    Object.assign(info,{recall:rc.n,agree:ag.n,disagree:dg.n,reason:rs.n,evidence:ev.n,polite:po.n,rude:ru.found,overlap});
  } else {
    const op=countPhrases(t,MARK.open), bo=countPhrases(t,MARK.body), cl=countPhrases(t,MARK.close);
    // kết luận nên nằm ở phần cuối
    const tail=norm(w.slice(Math.floor(nw*0.6)).join(" "));
    const clTail=countPhrases(tail,MARK.close).n>0;
    const head=norm(w.slice(0,Math.max(12,Math.floor(nw*0.25))).join(" "));
    const opHead=countPhrases(head,MARK.open).n>0;
    const sStruct=clamp((opHead?3.4:op.n?2:0)+Math.min(bo.n,3)*1.1+(clTail?3.3:cl.n?1.5:0));
    crit.push({key:"struct",name:"Bố cục 3 phần",v:sStruct});
    info.open=opHead; info.body=bo.n; info.close=clTail;
    if(kind==="trinhbay"||kind==="thaoluan"){
      const rs=countPhrases(t,MARK.reason), ev=countPhrases(t,MARK.evidence), opn=countPhrases(t,MARK.opinion);
      crit.push({key:"reason",name:"Lí lẽ, bằng chứng",v:clamp(Math.min(rs.n,4)*1.5+Math.min(ev.n,3)*1.4)});
      crit.push({key:"opinion",name:"Nêu rõ ý kiến",v:clamp(opn.n?6+Math.min(opn.n,4):1)});
      Object.assign(info,{reason:rs.n,evidence:ev.n,opinion:opn.n});
    } else {
      const bk=countPhrases(t,MARK.book), fe=countPhrases(t,MARK.feel), iv=countPhrases(t,MARK.invite);
      crit.push({key:"bookinfo",name:"Thông tin về sách",v:clamp(Math.min(bk.n,5)*2)});
      crit.push({key:"feel",name:"Cảm nhận, lời mời đọc",v:clamp(Math.min(fe.n,3)*2.2+(iv.n?3.4:0))});
      Object.assign(info,{book:bk.n,feel:fe.n,invite:iv.n});
    }
    crit.push({key:"topic",name:"Bám sát đề",v:clamp(Math.min(kwHit.n,8)*1.25)});
  }
  // trọng số
  const W={cover:1.8,sumstruct:1,conclude:1.2,dur:1,flu:1.2,pace:.6,struct:1.4,reason:1.5,opinion:1,topic:1.1,bookinfo:1.4,feel:1.2,listen:1.6,stance:1.2,polite:1};
  let sw=0,s=0;for(const c of crit){const k=W[c.key]||1;sw+=k;s+=c.v*k;c.v=r1(c.v)}
  const total=r1(s/sw);
  return {total,crit,metrics:{sec,nw,wpm,fill:fill.n,rep,fillFound:fill.found,kwFound:kwHit.found},info,estimated:!(seconds>0),isReply,isSum};
}

function buildFeedback(res,lesson){
  const praise=[],fix=[];
  const by=Object.fromEntries(res.crit.map(c=>[c.key,c.v]));
  const m=res.metrics, i=res.info, tg=res.isReply?[30,90]:res.isSum?[40,120]:KINDS[lesson.kind].target;
  const P=(k,txt)=>{if(by[k]!==undefined&&by[k]>=(k==="pace"?9.5:7.5))praise.push({k,txt})};
  const all=[];
  const F=(k,txt)=>{if(by[k]===undefined)return;all.push({k,v:by[k],txt});if(by[k]<6.5)fix.push({k,v:by[k],txt})};
  P("dur",`Em nói được ${fmtSec(m.sec)}, vừa đủ thời lượng.`);
  F("dur", m.sec<tg[0]?`Bài nói mới được ${fmtSec(m.sec)}. Hãy nói thêm một ý hoặc một ví dụ để đạt ít nhất ${fmtSec(tg[0])}.`:`Bài nói hơi dài (${fmtSec(m.sec)}). Hãy chọn ý chính, lược bớt ý trùng lặp.`);
  P("flu",m.fill?`Em chỉ dùng ${m.fill} từ đệm, lời nói khá trôi chảy.`:`Lời nói trôi chảy, gần như không có từ đệm.`);
  F("flu",`Em dùng ${m.fill} từ đệm${m.fillFound.length?` (${m.fillFound.slice(0,4).map(x=>"“"+x+"”").join(", ")})`:""}${m.rep?` và lặp từ ${m.rep} lần`:""}. Khi cần suy nghĩ, em hãy dừng lại một nhịp thay vì nói “ờ”.`);
  P("pace",`Tốc độ nói vừa phải (khoảng ${m.wpm} tiếng/phút), người nghe dễ theo dõi.`);

  if(by.struct!==undefined){
    P("struct","Bài nói có bố cục rõ ràng: Mở đầu – Triển khai – Kết luận.");
    if(by.struct<6.5){
      const miss=[]; if(!i.open)miss.push("lời mở đầu giới thiệu vấn đề"); if(i.body<2)miss.push("các từ nối ý như “thứ nhất”, “bên cạnh đó”"); if(!i.close)miss.push("phần kết luận (ví dụ “Tóm lại...”)");
      fix.push({k:"struct",v:by.struct,txt:`Bài nói còn thiếu ${miss.join(", ")}.`});
    }
  }
  P("reason","Em đã đưa ra lí lẽ và bằng chứng để làm rõ ý kiến.");
  F("reason", (i.evidence||0)===0?"Em mới nêu lí lẽ, chưa có bằng chứng. Hãy thêm một ví dụ thực tế, như “Chẳng hạn, ở quê em...”.":"Hãy giải thích rõ hơn vì sao, bằng các từ như “bởi vì”, “chính vì vậy”.");
  P("opinion","Em nêu ý kiến riêng rất rõ ràng.");
  F("opinion","Người nghe chưa thấy rõ ý kiến của em. Hãy nói thẳng: “Theo em, ...”.");
  P("topic",`Em bám sát đề, dùng tốt các từ khoá${m.kwFound.length?` như ${m.kwFound.slice(0,3).map(x=>"“"+x+"”").join(", ")}`:""}.`);
  F("topic","Bài nói chưa bám sát đề. Hãy nhắc lại tên vấn đề và nói về giá trị, hiện trạng hoặc cách giữ gìn.");
  P("bookinfo","Em giới thiệu đủ thông tin về cuốn sách.");
  F("bookinfo","Hãy nói rõ hơn về cuốn sách: tên, tác giả, nội dung chính, nhân vật.");
  P("feel","Em chia sẻ cảm nhận chân thành và có lời mời đọc hấp dẫn.");
  F("feel","Hãy nói thêm em thích điều gì nhất, và mời các bạn: “Các bạn hãy tìm đọc...”.");
  P("cover",`Em nắm được ý chính của ${i.covered}/${i.total} bạn. Nghe rất chăm chú!`);
  F("cover",`Em mới nêu được ý của ${i.covered||0}/${i.total||3} bạn. Hãy nghe lại, ghi nhanh từ khoá của từng bạn rồi tóm tắt.`);
  P("sumstruct","Em trình bày lại các ý kiến theo trình tự rõ ràng.");
  F("sumstruct","Hãy trình bày lần lượt: “Bạn thứ nhất cho rằng..., bạn thứ hai lại nghĩ..., còn bạn thứ ba...”.");
  P("conclude","Em đã nêu được kết luận chung của nhóm.");
  F("conclude","Cuối phần tóm tắt, hãy nêu kết luận: “Tóm lại, nhóm mình thống nhất rằng...”.");
  P("listen","Em đã lắng nghe và nhắc lại ý của bạn trước khi phản hồi. Rất tôn trọng!");
  F("listen","Trước khi phản hồi, hãy nhắc lại ý của bạn: “Bạn vừa cho rằng..., mình...”.");
  P("stance","Em thể hiện rõ mình đồng tình hay chưa đồng tình.");
  F("stance","Hãy nói rõ em đồng tình hay chưa đồng tình với bạn.");
  P("polite","Lời lẽ của em lịch sự, cầu thị.");
  F("polite",i.rude&&i.rude.length?`Tránh dùng từ như ${i.rude.map(x=>"“"+x+"”").join(", ")}. Hãy nói: “Mình tôn trọng ý kiến của bạn, nhưng...”.`:"Thêm các cách nói lịch sự như “Mình tôn trọng ý kiến của bạn, nhưng...”, “Cảm ơn bạn”.");
  fix.sort((a,b)=>a.v-b.v);
  if(!fix.length&&all.length){
    all.sort((a,b)=>a.v-b.v);const lo=all[0];
    const up={dur:"Thử giữ thời lượng ổn định và nhấn giọng ở các ý chính.",flu:"Thử nói không có từ đệm nào, dừng một nhịp khi cần suy nghĩ.",pace:"Thử điều chỉnh tốc độ, chậm lại ở các ý quan trọng.",struct:"Thử dùng thêm từ nối ý để phần Triển khai mạch lạc hơn.",reason:"Thử thêm một bằng chứng thực tế nữa để thuyết phục hơn.",opinion:"Thử nêu ý kiến của em sắc nét hơn ngay từ phần Mở đầu.",topic:"Thử nói sâu hơn về một khía cạnh: hiện trạng, giá trị hoặc hướng bảo tồn.",bookinfo:"Thử kể thêm một chi tiết đặc sắc của cuốn sách.",feel:"Thử chia sẻ một câu văn em thích nhất trong sách.",listen:"Thử tóm tắt ý bạn ngắn gọn hơn trước khi phản hồi.",cover:"Thử nêu thêm lí do mà mỗi bạn đưa ra.",sumstruct:"Thử dùng tên hoặc thứ tự từng bạn để người nghe dễ theo dõi.",conclude:"Thử nêu thêm việc làm cụ thể mà nhóm thống nhất.",stance:"Thử nói rõ hơn em đồng tình ở điểm nào, chưa đồng tình ở điểm nào.",polite:"Thử kết thúc bằng lời cảm ơn bạn đã chia sẻ."}[lo.k];
    if(up)fix.push({txt:"Để hay hơn nữa: "+up});
  }
  const PRI=["cover","listen","struct","reason","opinion","topic","bookinfo","feel","stance","polite","sumstruct","conclude","flu","dur","pace"];
  praise.sort((a,b)=>PRI.indexOf(a.k)-PRI.indexOf(b.k));
  return {praise:praise.slice(0,3).map(x=>x.txt),fix:fix.slice(0,2).map(x=>x.txt)};
}

function rainDrops(){
  if(REDUCED)return;
  const c=document.createElement("canvas");c.id="rain";document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext("2d");
  const cols=["#1E6FA8","#17A2A2","#3FA36B","#5BB7E8"];
  const ds=Array.from({length:46},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,v:3+Math.random()*4,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*4)]}));
  const t0=performance.now();
  (function f(t){g.clearRect(0,0,W,H);for(const d of ds){d.y+=d.v;g.fillStyle=d.c;g.beginPath();g.moveTo(d.x,d.y-d.s*1.6);g.bezierCurveTo(d.x+d.s,d.y,d.x+d.s,d.y+d.s,d.x,d.y+d.s);g.bezierCurveTo(d.x-d.s,d.y+d.s,d.x-d.s,d.y,d.x,d.y-d.s*1.6);g.fill();}
    if(t-t0<2200)requestAnimationFrame(f);else c.remove();})(t0);
}

function streak(){
  const days=[...new Set(HISTORY.map(h=>h.date.slice(0,10)))].sort().reverse();
  if(!days.length)return 0;
  let n=0,d=new Date();
  const iso=x=>x.toISOString().slice(0,10);
  if(days[0]!==iso(d)){d.setDate(d.getDate()-1);if(days[0]!==iso(d))return 0;}
  for(const day of days){if(day===iso(d)){n++;d.setDate(d.getDate()-1)}else break;}
  return n;
}

/* ---------- Nhận dạng giọng nói ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recOn=false,finalText="",t0=0,tick=null,elapsed=0;
function stopRec(){recOn=false;if(rec){try{rec.stop()}catch(e){}}clearInterval(tick);stopMeter();}
/* ---------- Sóng nước theo giọng nói ---------- */
const IS_MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
let meter={ctx:null,an:null,stream:null,raf:0,level:0,rings:[],last:0,buf:null};
async function startMeter(){
  if(meter.raf)return;
  meter.level=0;meter.rings=[];meter.raf=1;
  if(!IS_MOBILE&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    try{meter.stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const AC=window.AudioContext||window.webkitAudioContext;meter.ctx=new AC();
      const src=meter.ctx.createMediaStreamSource(meter.stream);meter.an=meter.ctx.createAnalyser();meter.an.fftSize=512;src.connect(meter.an);meter.buf=new Uint8Array(meter.an.fftSize);
    }catch(e){meter.an=null}
  }
  cancelAnimationFrame(meter.raf);meter.raf=requestAnimationFrame(drawRipple);
}
function stopMeter(){cancelAnimationFrame(meter.raf);meter.raf=0;try{meter.stream&&meter.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{meter.ctx&&meter.ctx.close()}catch(e){}meter.stream=meter.ctx=meter.an=null;
  const c=document.getElementById("ripple");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);const v=document.getElementById("vol");if(v)v.textContent="";}
function bumpLevel(x){meter.level=Math.max(meter.level,x)}
function drawRipple(ts){
  const c=document.getElementById("ripple");if(!c){meter.raf=0;return;}
  const g=c.getContext("2d"),W=c.width,H=c.height,cx=W/2,cy=H/2;
  let amp;
  if(meter.an){meter.an.getByteTimeDomainData(meter.buf);let sum=0;for(const v of meter.buf){const x=(v-128)/128;sum+=x*x}amp=Math.min(1,Math.sqrt(sum/meter.buf.length)*5);
    const vEl=document.getElementById("vol");if(vEl)vEl.textContent=amp<.12?"🔈 Giọng em hơi nhỏ, nói to hơn một chút nhé":amp<.45?"🔉 Âm lượng vừa phải":"🔊 Giọng em rõ ràng, tự tin!";}
  else{amp=meter.level;meter.level*=.94;}
  if(!REDUCED&&amp>.08&&ts-meter.last>170){meter.rings.push({r:112,max:130+amp*120,a:.55});meter.last=ts;}
  g.clearRect(0,0,W,H);
  const col=getComputedStyle(document.documentElement).getPropertyValue("--water").trim()||"#1E6FA8";
  g.lineWidth=4;
  meter.rings=meter.rings.filter(r=>r.a>0.02);
  for(const r of meter.rings){r.r+=2.4;r.a=Math.max(0,.55*(1-(r.r-112)/(r.max-112)));g.globalAlpha=r.a;g.strokeStyle=col;g.beginPath();g.arc(cx,cy,r.r,0,Math.PI*2);g.stroke();}
  g.globalAlpha=.18+amp*.35;g.fillStyle=col;g.beginPath();g.arc(cx,cy,112+amp*22,0,Math.PI*2);g.fill();g.globalAlpha=1;
  meter.raf=requestAnimationFrame(drawRipple);
}

  const three=pool.length?[0,1,2].map(k=>pool[(VIEW.peerIdx+k)%pool.length]):[];
  const peer=reply?pool[VIEW.peerIdx%pool.length]:summ?three.join(" | "):"";
  const hide=!!VIEW.hideTxt;

  const ol=d.outline;
  const NAMES=["An","Bình","Chi"];
  body.innerHTML=`

      <button data-m="solo" aria-pressed="${mode==="solo"}">🎤 Nêu ý kiến</button>
      <button data-m="summary" aria-pressed="${summ}">📝 Tóm tắt thảo luận</button></div>`:""}

  finalText="";elapsed=0;

      t0=Date.now()-elapsed*1000;clearInterval(tick);tick=setInterval(()=>{elapsed=(Date.now()-t0)/1000;const s=Math.floor(elapsed);timer.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},250);
    }catch(err){hint.textContent="Không mở được micro. Em hãy gõ bài nói ở ô bên dưới.";document.getElementById("typeBox").open=true;}

function speak(list){
  try{const v=speechSynthesis.getVoices().find(v=>/^vi/i.test(v.lang));if(!v)toast("Máy chưa có giọng đọc tiếng Việt, em hãy đọc lời của các bạn nhé");
    speechSynthesis.cancel();for(const text of list){const u=new SpeechSynthesisUtterance(text);u.lang="vi-VN";u.rate=.95;if(v)u.voice=v;speechSynthesis.speak(u);}}
  catch(e){toast("Máy chưa đọc được, em hãy đọc lời của các bạn nhé")}
}

function finish(l,d,text,seconds,typed,peer){
  const mode=VIEW.mode||"solo";
  const res=scoreSpeech({text,seconds,lesson:l,topic:d.topic,mode,peerText:peer,typed});
  const prev=[...HISTORY].reverse().find(h=>h.lessonId===l.id&&h.mode===mode);
  const entry={lessonId:l.id,lessonName:(l.id==="free"?"Tự do: "+l.de:"Bài "+l.id)+(mode==="summary"?" · tóm tắt":mode==="reply"?" · phản hồi":""),topic:d.topic,mode,total:res.total,crit:res.crit,metrics:res.metrics,date:new Date().toISOString(),text,peer:peer||"",attempt:HISTORY.filter(h=>h.lessonId===l.id).length+1,sent:false};
  const before=BADGES.filter(b=>b.ok()).length;
  HISTORY.push(entry);store.set("history",HISTORY);
  const got=BADGES.filter(b=>b.ok());const newBadge=got.length>before?got[got.length-1]:null;
  VIEW.result={res,entry,prev,typed,newBadge,fresh:true};VIEW.step="result";renderLesson();
}

async function sendToTeacher(entry,l){
  const note=document.getElementById("sendNote");
  if(!ME.stt){toast("Em hãy nhập số thứ tự ở trang chủ trước nhé");return;}
  const f=getFormConfig();
  if(!f.action){note.textContent="Cô chưa mở hộp thư nhận bài. Kết quả đã được lưu trên máy của em, em có thể gửi lại sau.";return;}
  const self=[...document.querySelectorAll('.check input')].filter(x=>x.checked).length;
  const by=Object.fromEntries(entry.crit.map(c=>[c.key,c.v]));
  const vals={stt:ME.stt,name:ME.name,topic:`${entry.lessonName} – ${entry.topic}${entry.mode==="reply"?" (phản hồi bạn)":entry.mode==="summary"?" (tóm tắt thảo luận)":""}`,attempt:entry.attempt,sec:Math.round(entry.metrics.sec),words:entry.metrics.nw,fill:entry.metrics.fill,wpm:entry.metrics.wpm,
    struct:by.struct??by.listen??by.cover??"",reason:by.reason??by.sumstruct??"",self:`${self}/${document.querySelectorAll('.check input').length} · tổng ${entry.total}`,reflect:"",text:entry.text};
  const fd=new URLSearchParams();for(const [k,id] of Object.entries(f.entries)){if(vals[k]!==undefined)fd.append(id,vals[k])}
  try{await fetch(f.action,{method:"POST",mode:"no-cors",body:fd});entry.sent=true;store.set("history",HISTORY);note.textContent="Đã gửi cho cô ✅";toast("Đã gửi cho cô ✅");}
  catch(e){note.textContent="Chưa gửi được (có thể do mất mạng). Em thử lại sau nhé.";}
}

  </div>`;
  document.getElementById("mkCode").onclick=()=>{
    const data={v:1,me:ME,h:HISTORY.map(h=>({l:h.lessonId,n:h.lessonName,tp:h.topic,m:h.mode,t:h.total,d:h.date,a:h.attempt,s:h.sent?1:0,mt:{sec:Math.round(h.metrics.sec),nw:h.metrics.nw,wpm:h.metrics.wpm,fill:h.metrics.fill}}))};
    const code="H2O-"+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    document.getElementById("codeTxt").value=code;document.getElementById("codeOut").hidden=false;
  };
  document.getElementById("cpCode").onclick=()=>{const ta=document.getElementById("codeTxt");
    navigator.clipboard.writeText(ta.value).then(()=>toast("Đã sao chép mã ✅")).catch(()=>{ta.focus();ta.select();toast("Em hãy bôi đen và sao chép mã nhé")})};
  document.getElementById("useCode").onclick=()=>{
    try{
      const raw=document.getElementById("codeIn").value.trim().replace(/^H2O-/,"");
      const data=JSON.parse(decodeURIComponent(escape(atob(raw))));
      const have=new Set(HISTORY.map(h=>h.date));
      const add=data.h.filter(x=>!have.has(x.d)).map(x=>({lessonId:x.l,lessonName:x.n,topic:x.tp,mode:x.m,total:x.t,date:x.d,attempt:x.a,sent:!!x.s,crit:[],metrics:{sec:x.mt.sec,nw:x.mt.nw,wpm:x.mt.wpm,fill:x.mt.fill,fillFound:[],kwFound:[]},text:""}));
      HISTORY=HISTORY.concat(add).sort((a,b)=>a.date.localeCompare(b.date));store.set("history",HISTORY);
      if(data.me&&!ME.stt&&!ME.name){ME=Object.assign(ME,data.me);store.set("me",ME)}
      toast(`Đã khôi phục ${add.length} lần luyện ✅`);renderJourney();
    }catch(e){toast("Mã chưa đúng. Em kiểm tra lại đã dán đủ mã chưa nhé")}
  };
}

function riverMap(){
  const narrow=innerWidth<560;
  const ST=narrow?[[70,50],[260,210],[70,370],[260,530]]:[[80,190],[240,70],[420,170],[580,60]];
  const n=BADGES.filter(b=>b.ok()).length; const at=Math.max(0,n-1);
  const d=narrow?"M70 50 C70 150 260 110 260 210 S70 270 70 370 S260 430 260 530":"M80 190 C160 190 160 70 240 70 S340 170 420 170 S510 60 580 60";
  const frac=n===0?0:[0,0.36,0.7,1][at];
  const pos=n===0?[ST[0][0],ST[0][1]]:ST[at];
  const lab=(i)=>{const [x,y]=ST[i];
    if(narrow){const L=x<150;const tx=L?x+30:x-30,an=L?"start":"end";return `<text x="${tx}" y="${y-2}" text-anchor="${an}" style="font-size:18px">${BADGES[i].e} ${BADGES[i].name}</text><text class="need" x="${tx}" y="${y+18}" text-anchor="${an}" style="font-size:13px">${BADGES[i].need}</text>`}
    const up=i%2===1;const an=i===0?"start":i===3?"end":"middle";const tx=i===0?x-20:i===3?x+20:x;return `<text x="${tx}" y="${up?y-38:y+40}" text-anchor="${an}">${BADGES[i].e} ${BADGES[i].name}</text><text class="need" x="${tx}" y="${up?y-22:y+56}" text-anchor="${an}">${BADGES[i].need}</text>`};
  return `<svg class="river" viewBox="${narrow?"0 0 330 580":"0 0 640 260"}" style="${narrow?"max-width:360px;margin:0 auto":""}" role="img" aria-label="Dòng sông hành trình: em đã đạt ${n} trên 4 chặng">
    <path d="${d}" fill="none" stroke="var(--surface-2)" stroke-width="26" stroke-linecap="round"/>
    <path id="riverDone" d="${d}" fill="none" stroke="url(#gDrop)" stroke-width="26" stroke-linecap="round" pathLength="1" stroke-dasharray="${frac} 1" ${frac?"":'stroke-opacity="0"'}/>
    <path d="${d}" fill="none" stroke="var(--bg)" stroke-width="2" stroke-dasharray="6 10" opacity=".7"/>
    ${ST.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="15" fill="${i<n?"var(--leaf)":"var(--surface)"}" stroke="${i<n?"var(--leaf)":"var(--line)"}" stroke-width="3"/>${i<n?`<path d="M${x-6} ${y} l4 4 l8 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`:""}${lab(i)}`).join("")}
    <g transform="translate(${narrow?(pos[0]<150?pos[0]-60:pos[0]+18):pos[0]-21} ${narrow?pos[1]-24:pos[1]-62})">${mascot("happy","",true).replace('<svg ','<svg width="42" height="46" ')}</g>
  </svg>
  <p class="small muted" style="margin-top:6px">${n===4?"Em đã ra tới biển lớn! 🌏":n?`Em đang ở chặng <b>${BADGES[at].name}</b>. Chặng tiếp theo: <b>${BADGES[at+1].name}</b> – ${BADGES[at+1].need.toLowerCase()}.`:"Luyện nói lần đầu để bắt đầu hành trình nhé!"}</p>`;
}
