const MARK = {
  open:["xin chào","kính chào","chào các bạn","chào thầy cô","em xin","tôi xin","hôm nay","em muốn trình bày","em xin trình bày","em xin giới thiệu","mình xin","mình muốn","sau đây","em sẽ trình bày"],
  body:["thứ nhất","thứ hai","thứ ba","đầu tiên","trước hết","tiếp theo","bên cạnh đó","ngoài ra","mặt khác","không chỉ","hơn nữa","sau đó","một là","hai là"],
  close:["tóm lại","nói tóm lại","cuối cùng","như vậy","kết luận","tổng kết","vì thế","cảm ơn","xin cảm ơn","em xin hết","em xin kết thúc"],
  reason:["vì","bởi vì","bởi","do đó","cho nên","vì vậy","chính vì","vì thế","lí do","bởi lẽ","nhờ"],
  evidence:["ví dụ","chẳng hạn","thực tế","số liệu","em đã từng","mình đã từng","ở quê em","bằng chứng","minh chứng","khi em","có lần","phần trăm","theo thống kê","theo sách","ông em","bà em","bố em","mẹ em","nhà em","lớp em","trường em"],
  opinion:["theo em","em nghĩ","em cho rằng","em thấy","ý kiến của em","quan điểm","theo mình","mình nghĩ","tôi cho rằng","theo tôi","em tin"],
  invite:["các bạn hãy","các bạn nên","nên đọc","mời các bạn","hãy đọc","hãy tìm đọc","đáng đọc"],
  book:["tác giả","nhà xuất bản","xuất bản","nhân vật","nội dung","cốt truyện","chương","chi tiết","kể về","viết về"],
  feel:["em thích","em ấn tượng","ấn tượng","bài học","ý nghĩa","xúc động","cảm động","yêu thích","em nhớ"],
  recall:["bạn vừa nói","bạn nói","ý kiến của bạn","bạn cho rằng","như bạn nói","bạn nghĩ","bạn vừa nêu","quan điểm của bạn"],
  agree:["đồng ý","đồng tình","tán thành","nhất trí","rất đúng","mình cũng nghĩ"],
  disagree:["không đồng ý","chưa đồng ý","có ý kiến khác","nghĩ khác","chưa hẳn","chưa đúng","không hẳn","phản đối","thì chưa"],
  polite:["cảm ơn","tôn trọng","xin phép","theo mình","mình nghĩ","bạn ơi","mình xin","có lẽ","mình thấy"],
  rude:["vớ vẩn","ngu","dở hơi","sai bét","nhảm","điên","im đi","dốt"]
};
const FILLERS = ["ờ","ừ","ừm","ơ","à","ạ à","hừm","kiểu là","kiểu như","thì là","là là","nói chung là","đại loại là","thực ra là","cái này","cái kia","thế thì","rồi thì"];

function norm(s){return " "+String(s).toLowerCase().replace(/[.,!?;:"“”'()\[\]…\-–—\n\r]+/g," ").replace(/\s+/g," ").trim()+" ";}
function countPhrases(t,list){let n=0,found=[];for(const p of list){const needle=" "+p+" ";let i=t.indexOf(needle),c=0;while(i!==-1){c++;i=t.indexOf(needle,i+needle.length-1)}if(c){n+=c;found.push(p)}}return {n,found};}
function words(t){return t.trim().split(/\s+/).filter(Boolean);}
function clamp(x,a=0,b=10){return Math.max(a,Math.min(b,x));}
function r1(x){return Math.round(x*10)/10;}

function scoreSpeech({text,seconds,lesson,topic,mode,peerText,typed,pauses}){
  const t=norm(text), w=words(t), nw=w.length;
  const kind=lesson.kind;
  const sec = seconds>0 ? seconds : Math.round(nw/150*60);
  const fill=countPhrases(t,FILLERS);
  // từ lặp liền nhau ("em em", "là là")
  let rep=0;for(let i=1;i<w.length;i++){if(w[i]===w[i-1]&&w[i].length>1)rep++;}
  const wpm = sec>0 ? Math.round(nw/sec*60) : 0;
  const per100 = nw? (fill.n+rep)/nw*100 : 0;
  const crit=[];
  const isReply = kind==="thaoluan" && mode==="reply";
  const isSum = kind==="thaoluan" && mode==="summary";
  const tgt = isReply ? [30,90] : isSum ? [40,120] : KINDS[kind].target;

  // Thời lượng
  /* Thời lượng chia mức (theo mục tiêu của từng kiểu bài) */
  const DL=[[tgt[0]/4,2,"Mức 1/5 · Mới bắt đầu"],[tgt[0]/2,4,"Mức 2/5 · Cần thêm ý"],[tgt[0]*3/4,6,"Mức 3/5 · Khá dần"],[tgt[0],8,"Mức 4/5 · Gần đạt"],[tgt[1],10,"Mức 5/5 · Đạt"],[tgt[1]+60,8,"Hơi dài"],[1e9,6,"Quá dài"]];
  let dl=DL.find(x=>sec<x[0])||DL[DL.length-1];let sDur=dl[1];
  let durNote=dl[1]<10&&sec<tgt[0]?dl[2]+" – cần thêm "+fmtSec(tgt[0]-sec):dl[1]<10?dl[2]+" – nên gọn dưới "+fmtSec(tgt[1]):dl[2];
  if(tgt[0]===120&&tgt[1]===300){ /* bài trình bày, giới thiệu sách: thang chi tiết do cô Thủy đề xuất */
    const s0=Math.round(sec);
    if(s0<30){sDur=2;durNote="Mới bắt đầu – cần thêm "+fmtSec(120-s0)+" để đạt";}
    else if(s0<60){sDur=4;durNote="Cần thêm ý – cần thêm "+fmtSec(120-s0)+" để đạt";}
    else if(s0<90){sDur=6;durNote="Khá dần – cần thêm "+fmtSec(120-s0)+" để đạt";}
    else if(s0<120){sDur=7;durNote="Gần đạt – cần thêm "+fmtSec(120-s0)+" để đạt";}
    else if(s0<=180){sDur=8;durNote="Đạt (2–3 phút) · nói đến 3 phút để được 10 điểm";}
    else if(s0<=300){sDur=10;durNote="Tốt (3–5 phút)";}
    else{const over=Math.ceil((s0-300)/30);sDur=Math.max(3,10-over);durNote="Quá 5 phút – trừ "+over+" điểm (mỗi 30 giây trừ 1 điểm)";}
  }
  crit.push({key:"dur",name:"Thời lượng",v:sDur,note:durNote});

  // Trôi chảy
  const lp=Number.isFinite(pauses)?pauses:0;
  let sFlu=clamp(10-per100*1.6-Math.max(0,lp-1)*0.9);
  sFlu=Math.min(sFlu,6+4*Math.min(1,sec/tgt[0]));if(typed)sFlu=Math.min(sFlu,8);
  crit.push({key:"flu",name:"Trôi chảy",v:sFlu});

  // Tốc độ (âm tiết/phút)
  let sPace; if(wpm>=120&&wpm<=175) sPace=10; else if(wpm<120) sPace=clamp(10-(120-wpm)/10); else sPace=clamp(10-(wpm-175)/10);
  crit.push({key:"pace",name:"Tốc độ nói",v:sPace});

  const tw=topic?norm(topic).trim().split(" ").filter(Boolean):[];const kw=(lesson.keywords||[]).concat(topic?[tw.join(" ")]:[]).concat(tw.slice(0,-1).map((x,i)=>x+" "+tw[i+1]).filter(x=>x.length>4));
  const kwHit=countPhrases(t,[...new Set(kw)]);
  const info={};

  if(isSum){
    const STOP=new Set(["mình","bạn","là","của","và","thì","không","cũng","cho","với","những","các","một","được","này","đó","nên","rồi","học","sinh","có","để","khi","việc","người","chỉ","như","nghĩ","cần"]);
    const ops=String(peerText||"").split("|").map(x=>norm(x).trim().split(" ").filter(w=>w.length>1&&!STOP.has(w)));
    let covered=0;const covers=[];
    for(const o of ops){const u=[...new Set(o)];const hit=u.filter(x=>t.includes(" "+x+" ")).length;const ok=u.length&&hit/u.length>=.3;covers.push(ok);if(ok)covered++;}
    const sm=countPhrases(t,["thứ nhất","thứ hai","thứ ba","đầu tiên","tiếp theo","bạn thứ nhất","bạn thứ hai","bạn thứ ba","một bạn","có bạn","bạn khác","bạn còn lại","bạn an","bạn bình","bạn chi","cho rằng","ý kiến","đa số","một số bạn"]);
    const cc=countPhrases(t,["tóm lại","như vậy","kết luận","thống nhất","nhóm mình","nhóm em","chúng ta","cuối cùng","nói chung"]);
    crit.push({key:"cover",name:"Nắm ý chính các bạn",v:ops.length?covered/ops.length*10:0});
    crit.push({key:"sumstruct",name:"Trình bày lại mạch lạc",v:clamp(Math.min(sm.n,5)*2)});
    crit.push({key:"conclude",name:"Kết luận chung",v:clamp(cc.n?6+Math.min(cc.n,2)*2:1)});
    Object.assign(info,{covered,total:ops.length,covers});
  } else if(isReply){
    const pw=norm(peerText||"").trim().split(" ").filter(x=>x.length>2);
    const overlap=[...new Set(pw)].filter(x=>t.includes(" "+x+" ")).length;
    const rc=countPhrases(t,MARK.recall), ag=countPhrases(t,MARK.agree), dg=countPhrases(t,MARK.disagree);
    const rs=countPhrases(t,MARK.reason), ev=countPhrases(t,MARK.evidence), po=countPhrases(t,MARK.polite), ru=countPhrases(t,MARK.rude);
    crit.push({key:"listen",name:"Lắng nghe ý bạn",v:clamp((rc.n?5:0)+Math.min(overlap,5))});
    crit.push({key:"stance",name:"Nêu rõ quan điểm",v:clamp((ag.n||dg.n)?7+Math.min(countPhrases(t,MARK.opinion).n,3):countPhrases(t,MARK.opinion).n?5:1)});
    crit.push({key:"reason",name:"Lí lẽ, bằng chứng",v:clamp(Math.min(rs.n,3)*2.2+Math.min(ev.n,2)*1.7)});
    crit.push({key:"polite",name:"Lời lẽ lịch sự",v:clamp(5+Math.min(po.n,3)*1.7-ru.n*4)});
    Object.assign(info,{recall:rc.n,agree:ag.n,disagree:dg.n,reason:rs.n,evidence:ev.n,polite:po.n,rude:ru.found,overlap});
  } else {
    const op=countPhrases(t,MARK.open), bo=countPhrases(t,MARK.body), cl=countPhrases(t,MARK.close);
    // kết luận nên nằm ở phần cuối
    const tail=norm(w.slice(Math.floor(nw*0.6)).join(" "));
    const clTail=countPhrases(tail,MARK.close).n>0;
    const head=norm(w.slice(0,Math.max(12,Math.floor(nw*0.25))).join(" "));
    const opHead=countPhrases(head,MARK.open).n>0;
    const sStruct=clamp((opHead?3.4:op.n?2:0)+Math.min(bo.n,3)*1.1+(clTail?3.3:cl.n?1.5:0));
    crit.push({key:"struct",name:"Bố cục 3 phần",v:sStruct});
    info.open=opHead; info.body=bo.n; info.close=clTail;
    if(kind==="trinhbay"||kind==="thaoluan"){
      const rs=countPhrases(t,MARK.reason), ev=countPhrases(t,MARK.evidence), opn=countPhrases(t,MARK.opinion);
      crit.push({key:"reason",name:"Lí lẽ, bằng chứng",v:clamp(Math.min(rs.n,4)*1.2+Math.min(ev.n,3)*1.6+(rs.n&&ev.n?0:-1))});
      crit.push({key:"opinion",name:"Nêu rõ ý kiến",v:clamp(opn.n?5+Math.min(opn.n,3)*1.2+(rs.n?1.4:0):1)});
      Object.assign(info,{reason:rs.n,evidence:ev.n,opinion:opn.n});
    } else {
      const bk=countPhrases(t,MARK.book), fe=countPhrases(t,MARK.feel), iv=countPhrases(t,MARK.invite);
      crit.push({key:"bookinfo",name:"Thông tin về sách",v:clamp(Math.min(bk.n,5)*2)});
      crit.push({key:"feel",name:"Cảm nhận, lời mời đọc",v:clamp(Math.min(fe.n,3)*2.2+(iv.n?3.4:0))});
      Object.assign(info,{book:bk.n,feel:fe.n,invite:iv.n});
    }
    let sc=null;try{sc=getScaf(lesson,topic)}catch(e){}
    if(sc&&!sc.own&&sc.y&&sc.y.length){
      const SW=new Set(["của","và","với","có","là","các","những","một","được","cho","để","trong","từ","bị","em","mình","nhiều","hơn","rất","đã","cần","như"]);
      const groups=sc.y.map(([h,k])=>{const out=new Set();String(k).split(/[·,()–]/).map(x=>norm(x).trim()).filter(Boolean).forEach(ph=>{const ws=ph.split(" ");if(ws.length<=2&&ph.length>3)out.add(ph);for(let q=0;q+1<ws.length;q++){if(SW.has(ws[q])||SW.has(ws[q+1]))continue;out.add(ws[q]+" "+ws[q+1])}});["món ăn","học sinh","ý kiến"].forEach(x=>out.delete(x));return [...out]});
      const hitG=groups.map(g=>countPhrases(t,g).found);const nG=hitG.filter(f=>f.length).length;const gScore=hitG.reduce((a,f)=>a+(f.length>=2?1:f.length?0.55:0),0);
      crit.push({key:"topic",name:"Bám sát đề",v:clamp(gScore/groups.length*8.5+Math.min(kwHit.n,3)*0.5)});
      info.groups={hit:nG,total:groups.length,heads:sc.y.map(x=>x[0]),hitG};
    } else crit.push({key:"topic",name:"Bám sát đề",v:clamp(Math.min(kwHit.n,10)*1.1)});
  }
  // vốn từ, ý phong phú: số tiếng khác nhau
  {const uniq=new Set(w).size;crit.push({key:"rich",name:"Vốn từ, ý phong phú",v:clamp((uniq-15)/13)});info.uniq=uniq;}
  // trọng số
  const W={rich:1,cover:1.8,sumstruct:1,conclude:1.2,dur:1.4,flu:1.2,pace:.6,struct:1.4,reason:1.5,opinion:1,topic:1.1,bookinfo:1.4,feel:1.2,listen:1.6,stance:1.2,polite:1};
  let sw=0,s=0;for(const c of crit){const k=W[c.key]||1;sw+=k;s+=c.v*k;c.v=r1(c.v)}
  let tot=s/sw;if(sec<tgt[0])tot*=(0.55+0.45*sec/tgt[0]);
  const total=r1(tot);
  return {total,crit,metrics:{sec,nw,wpm,fill:fill.n,rep,pauses:Number.isFinite(pauses)?pauses:null,fillFound:fill.found,kwFound:kwHit.found},info,estimated:!(seconds>0),isReply,isSum};
}

function buildFeedback(res,lesson){
  const praise=[],fix=[];

  const m=res.metrics, i=res.info, tg=res.isReply?[30,90]:res.isSum?[40,120]:KINDS[lesson.kind].target;
  const P=(k,txt)=>{if(by[k]!==undefined&&by[k]>=(k==="pace"?9.5:7.5))praise.push({k,txt})};
  const all=[];
  const F=(k,txt)=>{if(by[k]===undefined)return;all.push({k,v:by[k],txt});if(by[k]<6.5)fix.push({k,v:by[k],txt})};
  P("dur",`Em nói được ${fmtSec(m.sec)}, vừa đủ thời lượng.`);

  if(m.pauses>=3)fix.push({k:"flu",v:by.flu-0.01,txt:`Em có ${m.pauses} lần ngừng lâu (trên 3 giây). Hãy nhìn dàn ý và nối ý bằng các từ như “tiếp theo”, “bên cạnh đó” để lời nói liền mạch hơn.`});
  F("flu",`Em dùng ${m.fill} từ đệm${m.fillFound.length?` (${m.fillFound.slice(0,4).map(x=>"“"+x+"”").join(", ")})`:""}${m.rep?` và lặp từ ${m.rep} lần`:""}. Khi cần suy nghĩ, em hãy dừng lại một nhịp thay vì nói “ờ”.`);

      fix.push({k:"struct",v:by.struct,txt:`Bài nói còn thiếu ${miss.join(", ")}.`});
    }
  }
  P("reason","Em đã đưa ra lí lẽ và bằng chứng để làm rõ ý kiến.");
  F("reason", (i.evidence||0)===0?"Em mới nêu lí lẽ, chưa có bằng chứng. Hãy thêm một ví dụ thực tế, như “Chẳng hạn, ở quê em...”.":"Hãy giải thích rõ hơn vì sao, bằng các từ như “bởi vì”, “chính vì vậy”.");
  P("opinion","Em nêu ý kiến riêng rất rõ ràng.");

  P("topic",`Em bám sát đề, dùng tốt các từ khoá${m.kwFound.length?` như ${m.kwFound.slice(0,3).map(x=>"“"+x+"”").join(", ")}`:""}.`);
  if(i.groups){const miss=i.groups.heads.filter((h,k)=>!i.groups.hitG[k].length);if(by.topic<7.5&&miss.length)fix.push({k:"topic",v:by.topic,txt:`Bài nói còn thiếu ý về: ${miss.slice(0,2).map(x=>"“"+x+"”").join(", ")}. Mở “Bậc 2” ở bước Chuẩn bị để xem gợi ý nhé.`})}

  P("bookinfo","Em giới thiệu đủ thông tin về cuốn sách.");

  P("sumstruct","Em trình bày lại các ý kiến theo trình tự rõ ràng.");
  F("sumstruct","Hãy trình bày lần lượt: “Bạn thứ nhất cho rằng..., bạn thứ hai lại nghĩ..., còn bạn thứ ba...”.");
  P("conclude","Em đã nêu được kết luận chung của nhóm.");
  F("conclude","Cuối phần tóm tắt, hãy nêu kết luận: “Tóm lại, nhóm mình thống nhất rằng...”.");
  P("listen","Em đã lắng nghe và nhắc lại ý của bạn trước khi phản hồi. Rất tôn trọng!");
  F("listen","Trước khi phản hồi, hãy nhắc lại ý của bạn: “Bạn vừa cho rằng..., mình...”.");
  P("stance","Em thể hiện rõ mình đồng tình hay chưa đồng tình.");
  F("stance","Hãy nói rõ em đồng tình hay chưa đồng tình với bạn.");
  P("polite","Lời lẽ của em lịch sự, cầu thị.");
  F("polite",i.rude&&i.rude.length?`Tránh dùng từ như ${i.rude.map(x=>"“"+x+"”").join(", ")}. Hãy nói: “Mình tôn trọng ý kiến của bạn, nhưng...”.`:"Thêm các cách nói lịch sự như “Mình tôn trọng ý kiến của bạn, nhưng...”, “Cảm ơn bạn”.");
  fix.sort((a,b)=>a.v-b.v);
  if(!fix.length&&all.length){
    all.sort((a,b)=>a.v-b.v);const lo=all[0];
    const up={dur:"Thử giữ thời lượng ổn định và nhấn giọng ở các ý chính.",flu:"Thử nói không có từ đệm nào, dừng một nhịp khi cần suy nghĩ.",pace:"Thử điều chỉnh tốc độ, chậm lại ở các ý quan trọng.",struct:"Thử dùng thêm từ nối ý để phần Triển khai mạch lạc hơn.",reason:"Thử thêm một bằng chứng thực tế nữa để thuyết phục hơn.",opinion:"Thử nêu ý kiến của em sắc nét hơn ngay từ phần Mở đầu.",topic:"Thử nói sâu hơn về một khía cạnh: hiện trạng, giá trị hoặc hướng bảo tồn.",bookinfo:"Thử kể thêm một chi tiết đặc sắc của cuốn sách.",feel:"Thử chia sẻ một câu văn em thích nhất trong sách.",listen:"Thử tóm tắt ý bạn ngắn gọn hơn trước khi phản hồi.",cover:"Thử nêu thêm lí do mà mỗi bạn đưa ra.",sumstruct:"Thử dùng tên hoặc thứ tự từng bạn để người nghe dễ theo dõi.",conclude:"Thử nêu thêm việc làm cụ thể mà nhóm thống nhất.",stance:"Thử nói rõ hơn em đồng tình ở điểm nào, chưa đồng tình ở điểm nào.",polite:"Thử kết thúc bằng lời cảm ơn bạn đã chia sẻ."}[lo.k];
    if(up)fix.push({txt:"Để hay hơn nữa: "+up});
  }
  const PRI=["cover","listen","struct","reason","opinion","rich","topic","bookinfo","feel","stance","polite","sumstruct","conclude","flu","dur","pace"];
  praise.sort((a,b)=>PRI.indexOf(a.k)-PRI.indexOf(b.k));
  return {praise:praise.slice(0,3).map(x=>x.txt),fix:fix.slice(0,2).map(x=>x.txt)};
}

function rainDrops(){
  if(REDUCED)return;
  const c=document.createElement("canvas");c.id="rain";document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext("2d");
  const cols=["#1E6FA8","#17A2A2","#3FA36B","#5BB7E8"];
  const ds=Array.from({length:46},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,v:3+Math.random()*4,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*4)]}));
  const t0=performance.now();
  (function f(t){g.clearRect(0,0,W,H);for(const d of ds){d.y+=d.v;g.fillStyle=d.c;g.beginPath();g.moveTo(d.x,d.y-d.s*1.6);g.bezierCurveTo(d.x+d.s,d.y,d.x+d.s,d.y+d.s,d.x,d.y+d.s);g.bezierCurveTo(d.x-d.s,d.y+d.s,d.x-d.s,d.y,d.x,d.y-d.s*1.6);g.fill();}
    if(t-t0<2200)requestAnimationFrame(f);else c.remove();})(t0);
}

function streak(){
  const days=[...new Set(HISTORY.map(h=>h.date.slice(0,10)))].sort().reverse();
  if(!days.length)return 0;
  let n=0,d=new Date();
  const iso=x=>x.toISOString().slice(0,10);
  if(days[0]!==iso(d)){d.setDate(d.getDate()-1);if(days[0]!==iso(d))return 0;}
  for(const day of days){if(day===iso(d)){n++;d.setDate(d.getDate()-1)}else break;}
  return n;
}

    <section class="card stack">
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start">${mascot("think","")} <p class="small" style="flex:1"><b>Bé Giọt gợi ý:</b> Trước tiên, em hãy tự suy nghĩ và trả lời các câu hỏi dưới đây bằng lời của mình. Không cần viết thành bài, chỉ cần vài ý ngắn. Nếu bí ý, em mở gợi ý theo bậc ở phía dưới.</p></div>
      ${l.questions.map((q,i)=>`<div class="q"><p>${i+1}. ${esc(q)}</p><textarea id="qa${i}" data-q="${i}" placeholder="Ý của em...">${esc(d.answers[i]||"")}</textarea></div>`).join("")}
    </section>
    <section class="card stack scaf" id="scafBox"></section>
    <section class="card stack">
      <h3>Dàn ý của em</h3>
      <div class="outline">
        <div class="part"><label for="o1">Mở đầu</label><textarea id="o1" data-o="mo" placeholder="Giới thiệu vấn đề và nêu khái quát ý kiến của em">${esc(d.outline.mo)}</textarea></div>
        <div class="part"><label for="o2">Triển khai</label><textarea id="o2" data-o="trien" placeholder="Các ý chính, lí lẽ, bằng chứng">${esc(d.outline.trien)}</textarea></div>

  const scafBox=document.getElementById("scafBox");

    scafBox.querySelectorAll("details.tier").forEach(el=>el.ontoggle=()=>{if(el.open){const t=+el.dataset.tier;if(t>(d.tier||0)){d.tier=t;saveD()}}});
    const cp=document.getElementById("scafCopy");if(cp)cp.onclick=()=>{const sc=getScaf(l,d.topic);if(!sc)return;
      const vals={o1:["mo",sc.m],o2:["trien",scafPlan(sc).map(x=>x.tr+"… ("+x.head+": "+x.kw+")").join("\n")],o3:["ket",sc.k]};
      const filled=Object.keys(vals).some(id=>{const el=document.getElementById(id);return el&&el.value.trim()});

  const switchTopic=nt=>{nt=String(nt||"").trim();if(!nt||nt===d.topic)return;d.saved=d.saved||{};

}


/* ---------- Âm thanh nước (tạo trực tiếp bằng Web Audio, không cần tệp) ---------- */
const SFX=(()=>{let ctx=null,on=true;try{on=localStorage.getItem("h2o_snd")!=="0"}catch(e){}
  const ac=()=>{if(!ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ctx=new A()}if(ctx.state==="suspended")ctx.resume();return ctx};
  const tone=(f1,f2,dur,type="sine",vol=.14,delay=0)=>{const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)};
  const ok=()=>on&&!(typeof recOn!=="undefined"&&recOn);
  return {
    get on(){return on},set(v){on=v;try{localStorage.setItem("h2o_snd",v?"1":"0")}catch(e){}},
    pop(){if(ok())tone(520,1100,.09,"sine",.10)},                         /* bong bóng vỡ khi bấm nút */
    drip(){if(on){tone(1500,480,.16,"sine",.16);tone(900,1300,.08,"sine",.06,.12)}}, /* giọt nước khi nói xong */
    chime(){if(ok())[523,659,784].forEach((f,i)=>tone(f,f*1.01,.35,"triangle",.10,i*.11))}, /* có kết quả */

        recOn=false;stopMeter();micB.classList.remove("on");clearInterval(tick);
        hint.textContent=(MSG[e.error]||"Micro gặp lỗi ("+e.error+"). Em thử tải lại trang, hoặc gõ bài nói ở ô bên dưới.");
        document.getElementById("typeBox").open=true;};
      rec.onstart=()=>{startMeter();};
      rec.onend=()=>{srBase=finalText;if(recOn){try{rec.start()}catch(e){}}};
      try{MUSIC.stop()}catch(e){}recOn=true;lastHeard=Date.now();rec.start();micB.classList.add("on");micB.setAttribute("aria-label","Tạm dừng");hint.textContent="Đang nghe… Bấm lần nữa để tạm dừng.";
      t0=Date.now()-elapsed*1000;clearInterval(tick);tick=setInterval(()=>{elapsed=(Date.now()-t0)/1000;const s=Math.floor(elapsed);timer.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},250);
    }catch(err){hint.textContent="Không mở được micro. Em hãy gõ bài nói ở ô bên dưới.";document.getElementById("typeBox").open=true;}
  };
  done.onclick=()=>{stopRec();finish(l,d,finalText,elapsed,false,peer,longPauses)};
  document.getElementById("typedGo").onclick=()=>{const tx=document.getElementById("typed").value.trim();if(words(tx).length<5){toast("Bài nói còn ngắn quá, em gõ thêm nhé");return;}finish(l,d,tx,+document.getElementById("typedSec").value||0,true,peer)};
}
function speak(list){

function finish(l,d,text,seconds,typed,peer,pauses){

async function sendToTeacher(entry,l,auto){
  const note=document.getElementById("sendNote")||{};

  const by=Object.fromEntries(entry.crit.map(c=>[c.key,c.v]));
  const MODE_VI={solo:l.kind==="thaoluan"?"Nêu ý kiến":"Trình bày",reply:"Phản hồi bạn",summary:"Tóm tắt thảo luận"};
  const vals={stt:ME.stt,name:ME.name||"",lesson:l.id==="free"?"Tự do":l.id==="custom"?"Cô giao":"Bài "+l.id,mode:MODE_VI[entry.mode]||entry.mode,topic:entry.topic,attempt:entry.attempt,
    total:String(entry.total).replace(".",","),crit:entry.crit.map(c=>c.name+": "+String(c.v).replace(".",",")).join("; "),
    sec:Math.round(entry.metrics.sec),words:entry.metrics.nw,fill:entry.metrics.fill,wpm:entry.metrics.wpm,pauses:entry.metrics.pauses??"",
    self:entry.selfTotal?`${(entry.selfIdx||[]).length}/${entry.selfTotal}`:"",text:entry.text};
  const fd=new URLSearchParams();for(const [k,id] of Object.entries(f.entries)){if(vals[k]!==undefined)fd.append(id,vals[k])}
  if(PENDING&&PENDING.entry===entry)PENDING=null;
  try{await fetch(f.action,{method:"POST",mode:"no-cors",body:fd,keepalive:true});entry.sent=true;store.set("history",HISTORY);note.textContent="Đã gửi kết quả, lời nói và tự đánh giá cho cô ✅";const sb=document.getElementById("send");if(sb)sb.remove();if(!auto)toast("Đã gửi cho cô ✅");}
  catch(e){note.textContent="Chưa gửi được (có thể do mất mạng). Em bấm “Gửi cho cô” để thử lại nhé.";if(auto&&!document.getElementById("send")&&note.before){const b=document.createElement("button");b.className="btn leaf";b.id="send";b.textContent="📨 Gửi cho cô";b.onclick=()=>sendToTeacher(entry,l);note.before(b)}}
}
const FORM_KEYS=["stt","name","lesson","mode","topic","attempt","total","crit","sec","words","fill","wpm","pauses","self","text"];
function getFormConfig(){
  const link=CONFIG.resultFormPrefill||"";if(!link)return {action:"",entries:{}};
  try{const u=new URL(link);const entries={};
    for(const [k,v] of u.searchParams){const m=/^a(\d{1,2})$/i.exec(v.trim());if(k.startsWith("entry.")&&m){const key=FORM_KEYS[+m[1]-1];if(key)entries[key]=k}}
    return {action:u.origin+u.pathname.replace(/\/viewform$/,"/formResponse"),entries};
  }catch(e){return {action:"",entries:{}}}
}

function riverMap(){
  const narrow=innerWidth<560;
  const ST=narrow?[[70,50],[260,210],[70,370],[260,530]]:[[80,190],[240,70],[420,170],[580,60]];
  const n=BADGES.filter(b=>b.ok()).length; const at=Math.max(0,n-1);
  const d=narrow?"M70 50 C70 150 260 110 260 210 S70 270 70 370 S260 430 260 530":"M80 190 C160 190 160 70 240 70 S340 170 420 170 S510 60 580 60";
  const frac=n===0?0:[0,0.36,0.7,1][at];
  const pos=n===0?[ST[0][0],ST[0][1]]:ST[at];

"Cuốn truyện lịch sử":"A historical novel","Một sản phẩm văn hoá truyền thống trong cuộc sống hiện tại":"A traditional cultural product in today's life","Ý thức trách nhiệm với cộng đồng của học sinh":"Students' sense of responsibility to the community","Ý nghĩa của tiếng cười trong đời sống":"The meaning of laughter in life","Một thói xấu của con người trong xã hội hiện đại":"A bad habit in modern society","Truyện":"A story","Được gợi ra từ tác phẩm văn học đã học":"An issue raised by a literary work we studied","Văn học trong đời sống hiện nay":"Literature in today's life","Tổ chức hợp lí nề nếp sinh hoạt của bản thân":"Organising your daily routine well","Về đích: Ngày hội với sách":"Finish line: Book festival"
};
const I18N_PAT=[
 [/^Bài (\d+)$/,m=>`Lesson ${m[1]}`],
 [/^Bài (\d+) · (.+?) · (.+)$/,m=>`Lesson ${m[1]} · ${trI(m[2])} · ${trI(m[3])}`],
 [/^Bài (\d+): (.+)$/,m=>`Lesson ${m[1]}: ${m[2]}`],
 [/^Bài$/,()=>"Lesson"],
 [/^Mục tiêu: (.+) – (.+)$/,m=>`Target: ${durI(m[1])} – ${durI(m[2])}`],
 [/^(\d+ phút( \d+ giây)?|\d+ giây)$/,m=>durI(m[1])],
 [/^Giọt điểm (.+) trên 10$/,m=>`Score drop: ${m[1]} out of 10`],
 [/^Dòng sông hành trình: em đã đạt (\d) trên 4 chặng$/,m=>`Journey river: you have reached ${m[1]} of 4 stages`],
 [/^– (.+)\.$/,m=>`– ${(trI(m[1].charAt(0).toUpperCase()+m[1].slice(1))).toLowerCase()}.`],
 [/^Đã khôi phục (\d+) lần luyện ✅$/,m=>`Restored ${m[1]} practices ✅`],
 [/^Bài nói hơi dài \((.+)\)\. Hãy chọn ý chính, lược bớt ý trùng lặp\.$/,m=>`Your talk is a bit long (${durI(m[1])}). Keep the main points and cut repetition.`],
 [/^Bài nói mới được (.+)\. Hãy nói thêm một ý hoặc một ví dụ để đạt ít nhất (.+)\.$/,m=>`Your talk lasted only ${durI(m[1])}. Add one more point or example to reach at least ${durI(m[2])}.`],
 [/^Em chỉ dùng (\d+) từ đệm, lời nói khá trôi chảy\.$/,m=>`You used only ${m[1]} fillers, quite fluent.`],
 [/^Em có (\d+) lần ngừng lâu \(trên 3 giây\)\. .*$/,m=>`You had ${m[1]} long pauses (over 3 seconds). Look at your outline and link ideas with words like “next”, “besides” to keep flowing.`],
 [/^Em mới nêu được ý của (\d+)\/(\d+) bạn\. .*$/,m=>`You covered ${m[1]}/${m[2]} classmates' ideas. Listen again, note each person's key words, then summarise.`],
 [/^Em nói hơi chậm \((\d+) tiếng\/phút\)\. .*$/,m=>`You spoke a little slowly (${m[1]} syllables/min). Try to flow more, pausing at punctuation.`],
 [/^Em nói hơi nhanh \((\d+) tiếng\/phút\)\. .*$/,m=>`You spoke a little fast (${m[1]} syllables/min). Slow down so listeners can follow.`],
 [/^Em nói được (.+), vừa đủ thời lượng\.$/,m=>`You spoke for ${durI(m[1])}, just the right length.`],
 [/^Em nắm được ý chính của (\d+)\/(\d+) bạn\. Nghe rất chăm chú!$/,m=>`You caught the main idea of ${m[1]}/${m[2]} classmates. Great listening!`],
 [/^Tốc độ nói vừa phải \(khoảng (\d+) tiếng\/phút\), người nghe dễ theo dõi\.$/,m=>`Good pace (about ${m[1]} syllables/min), easy to follow.`],
 [/^Em bám sát đề, dùng tốt các từ khoá( như (.+))?\.$/,m=>`You stayed on topic and used key words well${m[2]?` such as ${m[2]}`:""}.`],
 [/^Em dùng (\d+) từ đệm( \((.+?)\))?( và lặp từ (\d+) lần)?\. Khi cần suy nghĩ, em hãy dừng lại một nhịp thay vì nói “ờ”\.$/,m=>`You used ${m[1]} fillers${m[3]?` (${m[3]})`:""}${m[5]?` and repeated words ${m[5]} times`:""}. When you need to think, pause for a beat instead of saying “uh”.`],
 [/^Mức (\d)\/5 · (.+?)( – cần thêm (.+))?$/,m=>`Level ${m[1]}/5 · ${({"Mới bắt đầu":"Just started","Cần thêm ý":"Needs more ideas","Khá dần":"Getting better","Gần đạt":"Almost there","Đạt":"Achieved"})[m[2]]||m[2]}${m[4]?` – ${durI(m[4])} more needed`:""}`],
 [/^(Hơi dài|Quá dài)( – nên gọn dưới (.+))?$/,m=>`${m[1]==="Hơi dài"?"A bit long":"Too long"}${m[3]?` – keep it under ${durI(m[3])}`:""}`],
 [/^Nói được (\d+)\/(\d+) nhóm ý chính gợi ý$/,m=>`Covered ${m[1]}/${m[2]} suggested idea groups`],
 [/^Bài nói còn thiếu ý về: (.+)\. Mở “Bậc 2” ở bước Chuẩn bị để xem gợi ý nhé\.$/,m=>`Your talk is missing ideas about: ${m[1]}. Open “Step 2” in Prepare for hints.`],
 [/^(Mới bắt đầu|Cần thêm ý|Khá dần|Gần đạt) – cần thêm (.+) để đạt$/,m=>`${({"Mới bắt đầu":"Just started","Cần thêm ý":"Needs more ideas","Khá dần":"Getting better","Gần đạt":"Almost there"})[m[1]]} – ${durI(m[2])} more to pass`],
 [/^Đạt \(2–3 phút\) · nói đến 3 phút để được 10 điểm$/,()=>"Pass (2–3 min) · reach 3 min for 10 points"],
 [/^Tốt \(3–5 phút\)$/,()=>"Good (3–5 min)"],
 [/^Quá 5 phút – trừ (\d+) điểm \(mỗi 30 giây trừ 1 điểm\)$/,m=>`Over 5 min – minus ${m[1]} (1 point per 30 s)`],
 [/^Bài nói còn thiếu (.+)\.$/,m=>{let t=m[1];["lời mở đầu giới thiệu vấn đề","các từ nối ý như “thứ nhất”, “bên cạnh đó”","phần kết luận (ví dụ “Tóm lại...”)"].forEach(k=>{t=t.split(k).join(I18N_EN[k])});return `Your talk is missing ${t}.`}]
];

/* ---------- Giao diện song ngữ VI / EN: dịch phần giao diện; nội dung bài học và lời nói vẫn bằng tiếng Việt ---------- */
let LANG="vi";try{const v=localStorage.getItem("h2o_lang");if(v==="vi"||v==="en"||v==="bi")LANG=v}catch(e){}
const durI=t=>String(t).replace(/(\d+) phút/g,"$1 min").replace(/(\d+) giây/g,"$1 s");
function trI(t){if(I18N_EN[t]!==undefined)return I18N_EN[t];for(const [re,fn] of I18N_PAT){const m=t.match(re);if(m)return fn(m)}return null}
const I18N_SKIP="script,style,textarea,.transcript,.olt,.peek,[data-noi18n],.bi";
const BI_SKIP=".stat,.chip,.num,.role summary,.toast,option,select,.timer,.target,svg,.brand";
function soleText(n){const p=n.parentNode;for(const c of p.childNodes){if(c===n)continue;if(c.nodeType===3&&!c.nodeValue.trim())continue;if(c.nodeType===1&&/^(SVG|IMG|BR|INPUT)$/i.test(c.tagName))continue;if(c.nodeType===1&&c.classList&&c.classList.contains("e"))continue;return false}return true}
function i18nNode(root){if(LANG==="vi"||!root)return;
  if(root.nodeType===3){const p=root.parentElement;if(!p||p.closest(I18N_SKIP))return;const raw=root.nodeValue,t=raw.replace(/\s+/g," ").trim();if(!t)return;const r=trI(t);if(r==null||r===t)return;
    if(LANG==="en"){root.nodeValue=raw.replace(raw.trim(),r);return}
    if(p.closest(BI_SKIP)||!soleText(root)||t.length<2||/^\d/.test(t))return;
    const sp=document.createElement("span");sp.className="bi";sp.appendChild(document.createTextNode(t));const en=document.createElement("span");en.className="en";en.lang="en";en.textContent=r.replace(/^[^\p{L}\p{N}“"(]+/u,"");sp.appendChild(en);
    p.replaceChild(sp,root);return}
  if(root.nodeType!==1)return;if(root.closest&&root.closest(I18N_SKIP))return;
  if(LANG==="en"){const els=[root,...root.querySelectorAll("[placeholder],[aria-label],[title]")];
    els.forEach(e=>{if(!e.getAttribute)return;["placeholder","aria-label","title"].forEach(k=>{const v=e.getAttribute(k);if(v){const r=trI(v.trim());if(r!=null&&r!==v)e.setAttribute(k,r)}})});}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const list=[];while(n=w.nextNode())list.push(n);list.forEach(i18nNode);}
(function(){
  const NAMES={vi:"VI",bi:"VI·EN",en:"EN"},NEXT={vi:"bi",bi:"en",en:"vi"},TIP={vi:"Tiếng Việt – bấm để chuyển sang song ngữ",bi:"Song ngữ Việt – Anh – bấm để chuyển sang tiếng Anh",en:"English – click for Vietnamese"};
  const hr=document.querySelector(".hdr-r");
  if(hr){const b=document.createElement("button");b.type="button";b.className="langBtn";b.id="langBtn";b.textContent=NAMES[LANG];b.dataset.noi18n="";
    b.setAttribute("aria-label",TIP[LANG]);b.title=TIP[LANG];
    b.onclick=()=>{try{localStorage.setItem("h2o_lang",NEXT[LANG])}catch(e){}location.reload()};hr.insertBefore(b,hr.firstChild);}
  if(LANG==="vi")return;
  if(LANG==="en"){document.documentElement.lang="en";document.title="Speak Fluently with Ms. H₂O";}
  i18nNode(document.body);
  new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")i18nNode(m.target);else if(m.type==="attributes")i18nNode(m.target);else m.addedNodes.forEach(i18nNode)}})
    .observe(document.body,{childList:true,subtree:true,characterData:true,attributes:LANG==="en",attributeFilter:LANG==="en"?["placeholder","aria-label","title"]:undefined});
})();
